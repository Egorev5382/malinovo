{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card bg-dark border-secondary">
                <div class="card-header text-center">
                    <h4>Тестовый кадр камеры</h4>
                </div>
                <div class="card-body text-center">
                    {% if has_photo %}
                    <img src="/startup/photo?t={{ range(100000)|random }}" class="img-fluid rounded mb-3" style="max-height:500px;">
                    <p class="text-muted">Проверьте что камера видит нужную зону</p>
                    <form method="POST" action="/startup/confirm">
                        <button type="submit" class="btn btn-success btn-lg">Подтвердить и запустить</button>
                    </form>
                    {% else %}
                    <div class="alert alert-warning">Кадр ещё не захвачен. Подождите...</div>
                    <meta http-equiv="refresh" content="3">
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
