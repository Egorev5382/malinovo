<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Gate Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body{background:#0f1923;color:#e8edf2;font-family:'Segoe UI',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
        .login-card{background:#1a2733;border:1px solid rgba(0,212,170,.2);border-radius:16px;padding:40px;width:100%;max-width:400px}
        .brand{color:#00d4aa;font-size:1.8rem;font-weight:700;text-align:center;margin-bottom:30px}
        .form-control{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);color:#e8edf2}
        .form-control:focus{border-color:#00d4aa;box-shadow:0 0 0 .2rem rgba(0,212,170,.25)}
        .btn-accent{background:#00d4aa;color:#000;font-weight:600;border:none}
        .btn-accent:hover{background:#00b894;color:#000}
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand"><i class="bi bi-camera-video"></i> GATE CONTROL</div>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}{% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
        {% endfor %}{% endif %}{% endwith %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Логин</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-accent w-100">Войти</button>
        </form>
    </div>
</body>
</html>
